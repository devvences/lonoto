name: Deploy static app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages only serves static files, so this build disables the movie
# lookup proxy (it needs the Node server / AWS deployment) and keeps notes
# fully local-first in the browser.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static app
        env:
          # Project Pages URL: https://devvences.github.io/lonoto/
          VITE_BASE_PATH: /lonoto/
          VITE_ENABLE_MOVIE_LOOKUP: 'false'
        run: npm run build

      # GitHub Pages runs Jekyll by default; skip it so Vite's assets are
      # served as-is.
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
